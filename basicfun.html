<!DOCTYPE html>
<html lang="en">
<head>
   
    <title>Functions in JS</title>
</head>
<body>
    <h1>Javascript Functions</h1>
    <button onclick="sayHello()">Click  me!</button>
    <p id="message"></p>
    <script>
        function sayHello(){
            document.getElementById("message").innerHTML = "Hello! welcome to the world of Javascript"
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<body>
    <p>A function can accesss variables defined inside the function:</p>
    <button type="button" onclick="myFunction()">Click me</button>
    <p id="demo"></p>
    <p demo1></p>
    <script>
        var b = 5;
        function myFunction() {
            var a = 4;
            document.getElementById("demo").innerHTML = b = a;
        }
        document.getElementById("demo").innerHTML = a;
        document.getElementById("demo").innerHTML = b;
    </script>
</body>
</html>
