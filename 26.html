<!DOCTYPE html>
<html>
<head>
  <title>My Birthday Countdown Checker</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(to right, #ffecd2, #fcb69f);
      text-align: center;
    }
    .card {
      width: 90%;
      max-width: 480px;
      background: white;
      border: 4px solid #ff6f91;
      border-radius: 20px;
      margin: 30px auto;
      padding: 20px;
    }
    h1 {
      color: #ff477e;
    }
    button {
      background: #ff477e;
      color: white;
      border: none;
      border-radius: 25px;
      padding: 12px 25px;
      font-size: 18px;
      cursor: pointer;
    }
    .box {
      background: #fff0f5;
      border: 2px dashed #ff6f91;
      border-radius: 12px;
      padding: 10px;
      margin-top: 12px;
      text-align: left;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>&#127874; My Birthday Countdown Checker</h1>
    <button onclick="checkCountdown()">Check Countdown</button>

    <div class="box">
      <h3>Missing Details</h3>
      <p id="missing"></p>
    </div>

    <div class="box">
      <h3>Greeting</h3>
      <p id="greeting"></p>
    </div>

    <div class="box">
      <h3>Days Left</h3>
      <p id="message"></p>
    </div>

    <div class="box">
      <h3>Countdown</h3>
      <p id="countdown"></p>
    </div>
  </div>

  <script>
    function checkCountdown() {
      let friendName = "Zara";
      let daysLeft = 3;

      let giftIdea = null;
      let cakeFlavour;

      document.getElementById("missing").innerHTML =
        "Gift Idea: " + giftIdea + "<br>" +
        "Cake Flavour: " + cakeFlavour;

      let hour = new Date().getHours();
      let greeting;

      if (hour < 12) {
        greeting = "Good Morning ";
      }
      else if (hour < 17) {
        greeting = "Good Afternoon ";
      }
      else {
        greeting = "Good Evening ";
      }

      document.getElementById("greeting").innerHTML =
        greeting + friendName;

      let message;

      if (daysLeft == 0) {
        message = "Today is the party!";
      }
      else if (daysLeft == 1) {
        message = "Tomorrow is the party!";
      }
      else {
        message = daysLeft + " days to go!";
      }

      document.getElementById("message").innerHTML = message;

      let countdown = "";
      let count = daysLeft;

      while (count >= 1) {
        countdown = countdown + "Days left: " + count + "<br>";
        count--;
      }

      countdown = countdown + "Party time!";

      document.getElementById("countdown").innerHTML = countdown;
    }
  </script>

</body>
</html>
