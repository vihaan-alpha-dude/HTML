<!DOCTYPE html>
<html lang="en">
<body>
<h2>JavaScript Array Methods</h2>
<h2>Join() and pop()</h2>
<p>The Join() method joins array elements into a string and the pop() methods removes the last element from an array.  </p>
<p id="myJoin"></p>
<p id="myfirstpop"></p>
<p id="mysecondpop"></p>    
<script>
    var fruits = ["Banana", "Orange", "Apple", "Mango" ];
    document.getElementById("myJoin").innerHTML = fruits.join(" * ");
    document.getElementById("myJoin").innerHTML = fruits;
    fruits.pop();
    document.getElementById("mySecondpop").innerHTML = fruits;
</script>
</body>
</html>
