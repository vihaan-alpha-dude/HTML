<!DOCTYPE html>
<html>
<head>
    <title>Multiplication Using Functions</title>
</head>
<body>

    <h1>Multiplication Using Functions</h1>

    <p id="result"></p>

    <script>
        function multiply(a, b) {
            return a * b;
        }

        let answer = multiply(5);

        document.getElementById("result").innerHTML =
            "Multiplication Result: " + answer;
    </script>

</body>
</html>
